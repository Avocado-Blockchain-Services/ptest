# ptest — one test command for every project and every agent.
#
#   ptest              scoped run, local and workers-capped, unless the path covers
#                      most of the suite — then it goes to the backend instead
#                      (see remote_scoped_min_files below)
#   ptest --full       remote if backend = "cloudrun", else local and capped
#   ptest where        what resolved for this directory
#   ptest doctor       config + backend health
#   ptest register     print a stanza for the repo you are standing in
#
# Why the cap exists: vitest and pytest -n auto each grab ~all cores. Three
# concurrent agent sessions auto-detecting the same machine is how load average
# reaches 42. Six agents politely taking 2 workers each beats three taking twelve.

[defaults]
workers           = 2      # per-agent worker cap for LOCAL runs. Never auto-detect.
# Workers for a run that owns its container. Must equal the --cpu the Cloud Run
# job is provisioned with (provision.sh / provision-vitest.sh); each run logs
# "detected parallelism" so drift between the two shows up in the log. Stated
# rather than auto-detected: in a container, nproc and Node's
# availableParallelism read the affinity mask, not the cgroup CPU quota, so a
# runner left to detect "every core" can see the host's.
remote_workers    = 8
daily_remote_runs = 60     # per project — a runaway agent loop must not spend all day
# A scoped run covering at least this many test files goes to the backend
# instead of running here: in persea-api, `ptest tests/api` alone covers
# roughly two-thirds of the whole test suite — --full-sized load wearing a
# scoped command's clothes. Narrow paths and any -k/-m/--lf filter always stay
# local, where a remote round trip would dominate. Overridable per project.
remote_scoped_min_files = 40
# Ceiling on simultaneous remote executions per job — a runaway-loop brake, not
# a mutex. Remote runs cost nothing locally and separate worktrees legitimately
# run at once, so this is set well above normal use.
max_concurrent_remote_runs = 6
# Identical in-flight requests share one execution; only passing results are
# reused, and only for this exact window after completion.
remote_cache_ttl_seconds = 3600
# Must exceed the Cloud Run task timeout (30 minutes here) so another caller
# cannot steal ownership from a legitimately slow execution.
remote_task_timeout_seconds = 1800
remote_claim_ttl_seconds = 2100
# Increment whenever the mutable runner image or job behavior changes.
runner_namespace = "v1"
region            = "us-central1"
# Never inherit `gcloud config set account`: this machine routinely has an
# unrelated client engagement's account active, which 403s on our own project.
account     = "you@example.com"
gcp_project = "your-test-project"
bucket      = "your-test-project-ptest"

# Worktrees need no configuration: ptest asks git which repo a worktree belongs to
# (--git-common-dir) and resolves the stanza from that, then runs in the worktree.
# `also_roots` exists only for directories that are not git worktrees of the root.

# ── persea ──────────────────────────────────────────────────────────────────────

[projects.persea-api]
root       = "/abs/path/to/persea_content_maker/persea_content_maker_api"
kind       = "pytest"
workers    = 2
scoped     = "uv run pytest"
# Parallelism is NOT stated here: ptest sets it per destination (remote_workers
# in the container, workers on this machine). CI uses xdist too — serial took
# 14m40s, xdist 2m43s.
# The path list is deliberately `tests` — a SUPERSET of CI, which enumerates
# specific paths and thereby skips tests/test_conftest_db_naming.py (the guard
# that fails the build when a concurrency test lacks `real_commits`) and
# tests/test_image_mode_residue.py. A pre-push gate that is stricter than CI is
# safe; one that shares CI's blind spot is not. CI should be fixed separately.
full       = "uv run pytest --cov=persea_content_maker_db --cov=content_maker_llm --cov=content_maker_crawler --cov=content_maker_api --cov-report=term-missing --cov-fail-under=85 tests"
backend    = "cloudrun"
job        = "ptest-persea-api"

[projects.persea-front]
root    = "/abs/path/to/persea_content_maker/persea_content_maker_front"
kind    = "vitest"
workers = 2                # vitest workers are ~350MB each — this is the memory hog
scoped  = "npm test --"
full    = "npm test --"   # `--` forwards ptest's worker count to vitest
# One job per project, each pinned to the node image matching THAT project's CI
# (ptest-runner-node:20 / :22). Never a shared `latest` — see provision-vitest.sh.
backend = "cloudrun"
job     = "ptest-persea-front"

# ── fullon2 ─────────────────────────────────────────────────────────────────────
# Four independent git repos under one umbrella, same shape as persea. All use uv.
# No coverage gate is configured in any of them, so `full` is the plain suite.

[projects.fullon2-core]
root    = "/abs/path/to/fullon2/fullon2"
kind    = "pytest"
workers = 2
scoped  = "uv run pytest"
# pyproject addopts already excludes e2e / s3_archive / live_llm / fuzz, and the
# suite carries `isolated` + `modifies_global_state` markers, so it is xdist-aware.
full    = "uv run pytest"
backend = "local"

[projects.fullon-api]
root    = "/abs/path/to/fullon2/fullon-api"
kind    = "pytest"
workers = 2
scoped  = "uv run pytest"
full    = "uv run pytest"
backend = "local"

[projects.fullon2-launchpad]
root    = "/abs/path/to/fullon2/fullon2_launchpad"
kind    = "pytest"
workers = 2
scoped  = "uv run pytest"
full    = "uv run pytest"
backend = "local"

[projects.fullon2-web]
root    = "/abs/path/to/fullon2/fullon2_web"
kind    = "vitest"
workers = 2          # vitest workers are ~350MB each — the memory hog
scoped  = "npm test --"
full    = "npm test --"   # `--` forwards ptest's worker count to vitest
backend = "local"

# ── template for any other project ──────────────────────────────────────────────
# Run `ptest register` inside the repo and paste what it prints.
#
# [projects.fullon2]
# root    = "/abs/path/to/fullon2"
# kind    = "pytest"
# workers = 2
# scoped  = "uv run pytest"
# full    = "uv run pytest"
# backend = "local"
#
# Spot queue configuration required for full and heavy-scoped execution:
# backend = "spot_queue"
# spot_topic = "ptest-spot-requests"
# spot_subscription = "ptest-spot-workers"  # status default; set if deployment differs
# spot_mig = "ptest-spot-workers"           # status default; set if deployment differs
# spot_controller_url = "https://ptest-spot-controller-....run.app"
# spot_overflow_reject_enabled = true  # advisory pre-upload 75 brake on observed saturation
# spot_result_timeout_seconds = 1800
# spot_cancel_quiesce_timeout_seconds = 180
