[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ptest-ng"
version = "0.1.0"
description = "Local-first test coordinator (NG rebuild)"
requires-python = ">=3.11,<3.15"
dependencies = ["psutil==7.2.2"]

[project.optional-dependencies]
test = ["pytest-xdist==3.8.0"]

[project.scripts]
ptest = "ptest.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "bandit==1.9.4", "pip-audit==2.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptest = [
  "runtime/*.py",
  "runtime/*.mjs",
  "runtime/protocol-v1.json",
  "resources/agent-guide.md",
  "resources/recipes/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests/ng"]
