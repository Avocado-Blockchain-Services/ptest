# Build the pytest runner image.
#
# An explicit config rather than `builds submit --tag`, because --tag only ever
# looks for a file named exactly `Dockerfile` and this directory will hold a
# second (vitest/node) runner alongside the pytest one.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.pytest", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
