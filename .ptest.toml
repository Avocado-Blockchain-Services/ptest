version = 1
project_id = "51267ba68f5301a17172322e836c3466"

[runner]
kind = "pytest"
launcher = ["uv", "run", "--locked", "--no-sync", "python"]
args = ["--cov=ptest", "--cov-report=term"]
full_args = []
test_roots = ["tests"]
workers = 8
lifecycle = "cooperative-process-group"

[setup]
argv = ["uv", "sync", "--locked", "--extra", "test"]
required_paths = [".venv/bin/python"]
network = true
lifecycle_scripts = true

[resources]
locks = []
memory_mb_per_worker = 0
probe_isolation = "undeclared"

[selection]
enabled = true
closed_inputs = true
input_roots = ["src/ptest", "tests"]
ignored_inputs = []
environment = []
full_triggers = [".ptest.toml", "pyproject.toml", "tests/ng/conftest.py", "uv.lock"]
always = []
no_tests = []
non_input_outputs = [".venv", "graphify-out", "src/ptest_ng.egg-info", "build", "dist",
                     "terraform/.terraform.lock.hcl", ".claude/scheduled_tasks.lock"]
